name: Ejecutable de Windows

# Construye "AUREA Sentinel.exe" en un Windows de GitHub y lo deja descargable en la pestaña Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt pillow
      # Las pruebas con ventanas (Qt) van en un proceso aparte: juntas con las del servidor abortan en Windows.
      - run: python -m pytest -q --ignore=tests/test_cliente_controlador.py --ignore=tests/test_vistas.py
      - run: python -m pytest -q tests/test_cliente_controlador.py tests/test_vistas.py
      - run: pyinstaller aurea_sentinel.spec
      - uses: actions/upload-artifact@v4
        with:
          name: AUREA Sentinel (Windows)
          path: dist/AUREA Sentinel.exe
